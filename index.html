<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Design</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#22201c;--mute:#6f6a60;--line:#e2ddd2;--brand:#8a5a3b}
@media (prefers-color-scheme:dark){:root{--bg:#1b1a18;--card:#26241f;--ink:#eee9df;--mute:#a59f93;--line:#3a372f;--brand:#d39a6e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Lao",system-ui,sans-serif;line-height:1.5}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
h1{font-size:1.2rem;margin:0}h2{font-size:1rem;margin:0 0 10px}
main{max-width:1150px;margin:auto;padding:16px;display:grid;gap:16px;grid-template-columns:340px 1fr}
@media (max-width:860px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 4px}
select,input,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:110px;font-family:monospace;font-size:.8rem}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--brand);background:var(--brand);color:#fff;cursor:pointer;margin-top:10px}
button.ghost{background:transparent;color:var(--brand)}
.row{display:flex;gap:8px;flex-wrap:wrap}
#imgColors{display:flex;gap:4px;margin-top:6px}#imgColors span{width:28px;height:28px;border-radius:6px;border:1px solid var(--line)}
#results{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.pal h3{margin:0;font-size:.95rem}.pal .sub{color:var(--mute);font-size:.8rem;margin-bottom:8px}
.sw{display:flex;align-items:center;gap:8px;font-size:.8rem;margin:3px 0}
.sw i{width:26px;height:20px;border-radius:4px;border:1px solid var(--line);flex:none}
.sw code{margin-left:auto;cursor:pointer}
svg.bld{width:100%;height:auto;border-radius:8px;background:#cfe3ef}
.tabs button{margin:0}
.note{font-size:.8rem;color:var(--mute)}
</style>
</head>
<body>
<header><h1 data-t="title"></h1><button class="ghost" id="lang" style="margin:0">EN</button></header>
<main>
<section class="card">
  <h2 data-t="input"></h2>
  <label data-t="type"></label><select id="type"></select>
  <label data-t="style"></label><select id="style"></select>
  <label data-t="climate"></label><select id="climate"></select>
  <label data-t="tone"></label><select id="tone"></select>
  <label data-t="mood"></label><input id="mood">
  <label data-t="img"></label><input type="file" id="img" accept="image/*">
  <div id="imgColors"></div>
  <div class="row"><button id="gen" data-t="gen"></button><button class="ghost" id="mkPrompt" data-t="prompt"></button></div>
  <div id="promptBox" hidden>
    <label data-t="promptHelp"></label><textarea id="promptTxt" readonly></textarea>
    <button class="ghost" id="copy" data-t="copy"></button>
    <label data-t="paste"></label><textarea id="jsonIn" placeholder='{"palettes":[...]}'></textarea>
    <button id="load" data-t="show"></button>
  </div>
</section>
<section>
  <div class="row tabs" style="margin-bottom:12px"><button id="tabRes" data-t="results"></button><button class="ghost" id="tabSaved" data-t="saved"></button></div>
  <div id="results"></div>
</section>
</main>

const ROLES=["wall","roof","trim","door","accent"];
function card(p,i,saved){return`<div class="card pal"><h3>${esc(p.harmony=="img"?t("fromImg"):T.en[p.harmony]&&!p.reason?t(p.harmony):p.name||"")}</h3><div class="sub">${esc(p.reason||"")}</div>${bld(p.colors)}
 ${ROLES.map(r=>`<div class="sw"><i style="background:${p.colors[r]}"></i>${t(r)}<code title="RGB ${rgb(p.colors[r])}">${p.colors[r].toUpperCase()}</code></div>`).join("")}
 <div class="row">${saved?`<button class="ghost" data-del="${i}">${t("del")}</button>`:`<button class="ghost" data-save="${i}">${t("save")}</button>`}<button class="ghost" data-png="${i}" data-s="${saved?1:0}">${t("png")}</button></div></div>`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const getSaved=()=>{try{return JSON.parse(localStorage.getItem("cd_saved")||"[]")}catch(e){return[]}};
const setSaved=a=>{try{localStorage.setItem("cd_saved",JSON.stringify(a))}catch(e){}};
function render(){const list=view=="res"?current:getSaved();$("tabRes").className=view=="res"?"":"ghost";$("tabSaved").className=view=="res"?"ghost":"";
 $("results").innerHTML=list.length?list.map((p,i)=>card(p,i,view!="res")).join(""):`<p class="note">${t("empty")}</p>`}
$("results").onclick=e=>{const b=e.target;if(b.dataset.save){const a=getSaved();a.push(current[b.dataset.save]);setSaved(a);b.textContent="✓"}
 if(b.dataset.del){const a=getSaved();a.splice(b.dataset.del,1);setSaved(a);render()}
 if(b.dataset.png){const p=(b.dataset.s=="1"?getSaved():current)[b.dataset.png];exportPng(p)}
 if(b.tagName=="CODE")navigator.clipboard?.writeText(b.textContent)};
function exportPng(p){const c=document.createElement("canvas");c.width=900;c.height=640;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,900,640);
 const im=new Image();im.onload=()=>{x.drawImage(im,20,20,560,355);x.fillStyle="#222";x.font="bold 26px 'Noto Sans Lao',sans-serif";x.fillText(p.name||"",20,420);
 ROLES.forEach((r,i)=>{const y=450+i*36;x.fillStyle=p.colors[r];x.fillRect(20,y,60,28);x.strokeStyle="#ccc";x.strokeRect(20,y,60,28);x.fillStyle="#222";x.font="18px 'Noto Sans Lao',sans-serif";x.fillText(`${t(r)}  ${p.colors[r].toUpperCase()}  (RGB ${rgb(p.colors[r])})`,95,y+21)});
 ROLES.forEach((r,i)=>{x.fillStyle=p.colors[r];x.fillRect(600,20+i*71,280,71)});
 const a=document.createElement("a");a.download=(p.name||"palette")+".png";a.href=c.toDataURL();a.click()};
 im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(bld(p.colors))}
$("gen").onclick=()=>{current=generate();view="res";render()};
$("tabRes").onclick=()=>{view="res";render()};$("tabSaved").onclick=()=>{view="saved";render()};
const lbl=k=>{const o=OPT[k].find(o=>o[0]==$(k).value);return o[2]};
$("mkPrompt").onclick=()=>{$("promptBox").hidden=false;$("promptTxt").value=
`You are an expert architectural color consultant. Design exterior color schemes for this building:
- Building type: ${lbl("type")}
- Architectural style: ${lbl("style")}
- Climate / location: ${lbl("climate")} (Laos, Southeast Asia)
- Preferred tone group: ${lbl("tone")}
- Desired mood: ${$("mood").value||"not specified"}
${imgHex.length?"- Colors extracted from my reference image: "+imgHex.join(", "):""}

Create 4 harmonious palettes using different color-harmony principles (e.g. monochrome, analogous, complementary, triadic). Consider sun exposure, heat, dirt/mold in rain, local culture and durability of exterior paint.
For each palette assign a color to: wall (main exterior wall), roof, trim (fascia/edges/frames), door (doors & window frames), accent.
Write "name" and "reason" in ${lang=="lo"?"Lao language":"English"}.

Reply with ONLY this JSON in a code block, nothing else:
{"palettes":[{"name":"","harmony":"","reason":"","colors":{"wall":"#RRGGBB","roof":"#RRGGBB","trim":"#RRGGBB","door":"#RRGGBB","accent":"#RRGGBB"}}]}`};
$("copy").onclick=()=>{navigator.clipboard?.writeText($("promptTxt").value);$("copy").textContent=t("copied")};
$("load").onclick=()=>{try{let s=$("jsonIn").value;s=s.slice(s.indexOf("{"),s.lastIndexOf("}")+1);const j=JSON.parse(s);
 current=j.palettes.filter(p=>p.colors&&ROLES.every(r=>/^#[0-9a-f]{6}$/i.test(p.colors[r])));if(!current.length)throw 0;view="res";render()}catch(e){alert(t("bad"))}};
fill();current=generate();render();
</script>
</body>
</html>
